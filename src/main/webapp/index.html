<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkIT - Sistem Manajemen Parkir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="parking-icon">🅿️</div>
        <h1>ParkIT</h1>
        <p class="tagline">Sistem Manajemen Parkir Digital Modern</p>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">⏱️</div>
                <div class="feature-text">Waktu Masuk/Keluar</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">💳</div>
                <div class="feature-text">Pembayaran Digital</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📊</div>
                <div class="feature-text">Laporan Parkir</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Keamanan</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">500+</div>
                <div class="stat-label">Area Parkir</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">10K+</div>
                <div class="stat-label">Transaksi/Hari</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">99.9%</div>
                <div class="stat-label">Akurasi</div>
            </div>
        </div>

        <button class="cta-button" onclick="alert('Selamat datang di ParkIT! Sistem manajemen parkir terintegrasi.')">Kelola Parkir</button>
    </div>

    <div class="footer">
        &copy; 2025 ParkIT. Solusi Parkir Digital Masa Kini.
    </div>
